[tool.poetry]
name = "ai-content-automation-engine"
version = "0.1.0"
description = "Pipeline that turns an idea into a narrated, subtitled short or long video"
authors = ["Hans <hans.acha.brand@gmail.com>", "Jeremy Ayza"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.0"
python-dotenv = "^1.0.1"
google-genai = "^1.56.0"
pillow = "^12.1.0"
pydantic = "^2.12.5"
winotify = { version = "^1.1.0", markers = "sys_platform == 'win32'" }
playwright = "^1.62.0"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^8.0.1"
flake8 = "^7.3.0"
pytest = "^8.3"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["pipeline", "tools", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"
pythonPlatform = "Windows"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
